name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build unsigned APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.unsigned.outputs.artifact-id }}
      apk_sha256: ${{ steps.prepare.outputs.apk_sha256 }}
      version_name: ${{ steps.prepare.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17.0.21.1+2'
          verify-signature: true
          force-download: true
          overwrite-settings: false
      - name: Check pinned Gradle wrapper
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256
      - name: Install fixed Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test, lint and build with strict dependency verification
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --dependency-verification strict :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease
      - name: Prepare unsigned release input
        id: prepare
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
        run: python3 scripts/prepare_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: unsigned
        with:
          name: Trainingsapp-unsigned-release-input
          path: build/release-input/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Trainingsapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Trainingsapp-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14

  sign:
    name: Sign validated APK on a fresh runner
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No checkout, Gradle, project scripts or build caches in this job.
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
      apk_sha256: ${{ steps.sign.outputs.apk_sha256 }}
    steps:
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17.0.21.1+2'
          verify-signature: true
          force-download: true
          overwrite-settings: false
      - name: Install fixed signing tools
        run: sdkmanager "build-tools;35.0.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/unsigned
          merge-multiple: true
          digest-mismatch: error
      - name: Validate exact artifact and APK before exposing the key
        shell: bash
        env:
          EXPECTED_APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          EXPECTED_VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "unsigned"
          if {p.name for p in folder.iterdir()} != {"app-release-unsigned.apk", "release.json"}:
              raise SystemExit("Unexpected release artifact contents")
          apk = folder / "app-release-unsigned.apk"
          if apk.is_symlink() or not apk.is_file() or not 0 < apk.stat().st_size <= 100 * 1024 * 1024:
              raise SystemExit("Invalid APK input")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          version = os.environ["EXPECTED_VERSION_NAME"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Invalid version name")
          expected = {
              "packageName": "de.trainingsapp", "versionName": version,
              "versionCode": int(os.environ["GITHUB_RUN_NUMBER"]),
              "sourceCommit": os.environ["GITHUB_SHA"], "unsignedSha256": digest,
              "buildRun": int(os.environ["GITHUB_RUN_ID"])
          }
          if json.loads((folder / "release.json").read_text()) != expected or digest != os.environ["EXPECTED_APK_SHA256"]:
              raise SystemExit("Release identity or checksum mismatch")
          sdk = pathlib.Path(os.environ.get("ANDROID_HOME") or os.environ["ANDROID_SDK_ROOT"])
          tools = sdk / "build-tools/35.0.0"
          badging = subprocess.check_output([str(tools / "aapt2"), "dump", "badging", str(apk)], text=True)
          match = re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          if not match or match.groups() != ("de.trainingsapp", str(expected["versionCode"]), version):
              raise SystemExit("APK manifest identity mismatch")
          if "application-debuggable" in badging or not re.search(r"^minSdkVersion:'26'$", badging, re.MULTILINE):
              raise SystemExit("Unexpected APK security configuration")
          permitted = {
              "android.permission.INTERNET", "android.permission.REQUEST_INSTALL_PACKAGES",
              "de.trainingsapp.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          }
          if not set(re.findall(r"^uses-permission(?:-sdk-23)?: name='([^']+)'", badging, re.MULTILINE)) <= permitted:
              raise SystemExit("APK requests unreviewed permissions")
          if subprocess.run([str(tools / "apksigner"), "verify", str(apk)], capture_output=True).returncode == 0:
              raise SystemExit("Expected an unsigned APK")
          subprocess.run([str(tools / "zipalign"), "-f", "-P", "16", "4", str(apk), str(folder / "aligned.apk")], check=True)
          print("Validated APK identity, checksum, permissions and unsigned input")
          PY
      - name: Sign and verify permanent certificate
        id: sign
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$ANDROID_SIGNING_PASSWORD" || {
            echo "::error::Permanent signing secrets are missing."
            exit 1
          }
          umask 077
          KEYSTORE="$RUNNER_TEMP/trainingsapp-release.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/signed"
          NAME="Trainingsapp-v${VERSION_NAME}-build${GITHUB_RUN_NUMBER}-signed.apk"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias trainingsapp \
            --ks-pass env:ANDROID_SIGNING_PASSWORD --key-pass env:ANDROID_SIGNING_PASSWORD \
            --min-sdk-version 26 --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "$RUNNER_TEMP/signed/$NAME" "$RUNNER_TEMP/unsigned/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/signed/$NAME" > "$RUNNER_TEMP/signature.txt"
          cat "$RUNNER_TEMP/signature.txt"
          mapfile -t CERTIFICATES < <(sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' "$RUNNER_TEMP/signature.txt" | tr '[:lower:]' '[:upper:]' | tr -d ' ' | sort -u)
          test "${#CERTIFICATES[@]}" -eq 1
          test "${CERTIFICATES[0]}" = "C1145F10EDACA6164AD111DB5D832BE885238FACF71B76408D7A95874EC43987"
          "$TOOLS/zipalign" -c -P 16 4 "$RUNNER_TEMP/signed/$NAME"
          SIGNED_APK="$RUNNER_TEMP/signed/$NAME" python3 - <<'PY'
          import hashlib, json, os, pathlib
          apk = pathlib.Path(os.environ["SIGNED_APK"])
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (apk.parent / (apk.name + ".sha256")).write_text(digest + "  " + apk.name + "\n")
          meta = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "unsigned/release.json").read_text())
          meta["signedSha256"] = digest
          meta["certificateSha256"] = "c1145f10edaca6164ad111db5d832be885238facf71b76408d7a95874ec43987"
          (apk.parent / "release.json").write_text(json.dumps(meta, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("apk_sha256=" + digest + "\n")
          PY
      - name: Remove private key even after failure
        if: always()
        run: rm -f "$RUNNER_TEMP/trainingsapp-release.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: signed
        with:
          name: Trainingsapp-signed-release-apk
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified signed prerelease
    needs: [build, sign]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job writes Releases. No signing key or project checkout.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: ${{ runner.temp }}/publish
          merge-multiple: true
          digest-mismatch: error
      - name: Check signed artifact identity
        env:
          EXPECTED_APK_SHA256: ${{ needs.sign.outputs.apk_sha256 }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          folder = pathlib.Path(os.environ["RUNNER_TEMP"]) / "publish"
          version = os.environ["VERSION_NAME"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Invalid release version")
          name = f"Trainingsapp-v{version}-build{os.environ['GITHUB_RUN_NUMBER']}-signed.apk"
          if {p.name for p in folder.iterdir()} != {name, name + ".sha256", "release.json"}:
              raise SystemExit("Unexpected signed artifact contents")
          meta = json.loads((folder / "release.json").read_text())
          digest = hashlib.sha256((folder / name).read_bytes()).hexdigest()
          if (digest != os.environ["EXPECTED_APK_SHA256"] or meta["signedSha256"] != digest
              or meta["sourceCommit"] != os.environ["GITHUB_SHA"]
              or meta["packageName"] != "de.trainingsapp" or meta["versionName"] != version
              or meta["versionCode"] != int(os.environ["GITHUB_RUN_NUMBER"])
              or meta["buildRun"] != int(os.environ["GITHUB_RUN_ID"])
              or meta["certificateSha256"] != "c1145f10edaca6164ad111db5d832be885238facf71b76408d7a95874ec43987"):
              raise SystemExit("Signed release identity mismatch")
          if (folder / (name + ".sha256")).read_text() != digest + "  " + name + "\n":
              raise SystemExit("Checksum sidecar mismatch")
          PY
      - name: Create signed prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}-build${GITHUB_RUN_NUMBER}"
          NAME="Trainingsapp-${TAG}-signed.apk"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Sicherheitsupdate: abgesicherte Exporte und Datensicherungsimporte, strengere Updateprüfung und gehärteter Buildprozess.
          App-ID und dauerhafter Signierschlüssel bleiben erhalten; die APK ist als normales Update installierbar.
          SHA-256-Datei und release.json dokumentieren Prüfsumme und Quellstand.
          NOTES
          gh release create "$TAG" \
            "$RUNNER_TEMP/publish/$NAME" "$RUNNER_TEMP/publish/$NAME.sha256" "$RUNNER_TEMP/publish/release.json" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Trainingsapp ${VERSION_NAME} (Build ${GITHUB_RUN_NUMBER}) - signiert" \
            --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
