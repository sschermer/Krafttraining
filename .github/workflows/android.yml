name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" && echo "Android SDK available"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Trainingsapp-0.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish debug APK as test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Trainingsapp-v0.1.0-debug.apk
          if ! gh release view v0.1.0-test >/dev/null 2>&1; then
            gh release create v0.1.0-test --title "Trainingsapp 0.1.0 - Testversion" --prerelease --notes "Erste Android-Testversion. Debug-APK (noch keine dauerhaft signierte Releaseversion)."
          fi
          gh release upload v0.1.0-test Trainingsapp-v0.1.0-debug.apk --clobber
